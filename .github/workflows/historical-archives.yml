name: Validate historical research archives

# Runs on every push and pull request, like Source validation, so each revision has both results (ADR-077).
# `mb2 validate history` checks this file keeps no path filter.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  historical-catalogues:
    name: Historical archive catalogues, rules and imagery metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      # Catalogue structure, unique stable IDs, rule citations, imagery metadata, manifest rights and no media binaries.
      - run: cargo run --release --manifest-path tools/mb2/Cargo.toml -- validate history
      # Rule/imagery contract tests and the 20 November 2026 expansion regression tests.
      - run: cargo test --release --manifest-path tools/mb2/Cargo.toml -- history::
