name: Validate historical research archives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "art_reference/**"
      - "Data/History/**"
      - "tools/historical_*"
      - "tools/validate_historical_archives.py"
      - "tests/python/test_historical_*"
      - ".github/workflows/historical-archives.yml"
  push:
    branches: [main]
    paths:
      - "art_reference/**"
      - "Data/History/**"
      - "tools/historical_*"
      - "tools/validate_historical_archives.py"
      - "tests/python/test_historical_*"
      - ".github/workflows/historical-archives.yml"

permissions:
  contents: read

jobs:
  historical-catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue structure, source references and rights metadata
        run: python3 tools/validate_historical_archives.py
      - name: Run legacy historical schema regression tests
        run: python3 -m unittest discover -s tests/python -p 'test_historical_*.py' -v
