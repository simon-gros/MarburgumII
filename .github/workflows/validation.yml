name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed-tools:
    name: C# manifest validation (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/MarburgumII.Tools -- verify

  repository-tools:
    name: Rust repository tooling and source contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --manifest-path tools/mb2/Cargo.toml
      # UI/HUD ontology graph, chat source contract, gameplay contract, Python-free tooling.
      - run: cargo run --release --manifest-path tools/mb2/Cargo.toml -- validate all
      # Lent ground generator (ADR-040): projection, rasters, polygon operations, triangulation.
      - run: cargo test --manifest-path tools/lent-ground/Cargo.toml

  rust-core:
    name: Rust native simulation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --manifest-path native/marburgum-sim-core/Cargo.toml

# This workflow does not test or package Unreal Engine 5.8.3.
