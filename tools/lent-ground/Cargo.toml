[package]
name = "lent-ground"
version = "0.1.0"
edition = "2021"
description = "Builds the Lent ground (bare-earth heights, paved surfaces, kerbs, surface masks) from ARSO LiDAR and OpenStreetMap"
publish = false

[dependencies]
las = { version = "0.9", features = ["laz"] }
serde_json = "1"
spade = "2"
i_overlay = "4"
png = "0.18"
sha2 = "0.10"
jpeg-decoder = "0.3"
flate2 = "1"
