; Marburgum II player-facing text (QA U11): gather every LOCTEXT/NSLOCTEXT from the client and game modules, keep the
; Slovene translation in Content/Localization/Game/sl/Game.po, and compile the .locres files the client loads.
; Run: UnrealEditor-Cmd MarburgumII.uproject -run=GatherText -config=Config/Localization/Game.ini -unattended
; (scripts/localize-linux.sh wraps it). Key-cap labels use FText::AsCultureInvariant and are not gathered.
[CommonSettings]
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=sl

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/MarburgumIIClient/
SearchDirectoryPaths=%LOCPROJECTROOT%Source/MarburgumII/
ExcludePathFilters=*/Tests/*
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import the translated PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write the localized text resources
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Game.locres

;Export PO files (new and changed strings appear untranslated for the translator)
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

;Word counts and conflicts
[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
