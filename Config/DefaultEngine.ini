; ADR-029: optional NVIDIA render features, found at runtime and never a build dependency. Each
; feature needs its plugin enabled, an NVIDIA GPU, these console variables and a true support query
; (a static parameterless UFUNCTION returning bool, "/Script/Module.Class:Function"). A missing piece
; makes the feature unavailable with that reason in the MB2RENDER log line; nothing crashes.
; The names are checked against NVIDIA's UE 5.8 DLSS 4.5 package v8.9.0 (Docs/RENDERING_NVIDIA.md).
[/Script/MarburgumIIClient.MarburgumRenderFeatureSubsystem]
DlssPlugin=DLSS
DlssEnableCVar=r.NGX.DLSS.Enable
DlssSupportQuery=/Script/DLSSBlueprint.DLSSLibrary:IsDLSSSupported
FrameGenerationPlugin=StreamlineDLSSG
FrameGenerationEnableCVar=r.Streamline.DLSSG.Enable
FrameGenerationSupportQuery=/Script/StreamlineDLSSGBlueprint.StreamlineLibraryDLSSG:IsDLSSGSupported
ReflexPlugin=StreamlineReflex
ReflexEnableCVar=t.Streamline.Reflex.Enable
ReflexModeCVar=t.Streamline.Reflex.Mode
ReflexSupportQuery=/Script/StreamlineReflexBlueprint.StreamlineLibraryReflex:IsReflexSupported
; ADR-030: DLSS 5 Neural Rendering through the vendored DLSS5ForUE5 source. Its runtime is never
; committed; the feature stays unavailable (runtime_missing) until one is supplied at this path.
NeuralRenderingPlugin=DLSS5ForUE5
NeuralRenderingEnableCVar=r.DLSS5.Enable
NeuralRenderingRuntimeFile=Binaries/ThirdParty/Win64/nvngx_dlssnr.dll
