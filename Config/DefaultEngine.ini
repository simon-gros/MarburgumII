GlobalDefaultGameMode=/Script/MarburgumII.MarburgumGameMode
GlobalDefaultServerGameMode=/Script/MarburgumII.MarburgumGameMode
GameDefaultMap=/Game/World/lent
ServerDefaultMap=/Game/World/lent
