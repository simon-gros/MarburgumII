[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/MarburgumII.MarburgumGameMode
GlobalDefaultServerGameMode=/Script/MarburgumII.MarburgumGameMode
GameDefaultMap=/Game/World/lent
ServerDefaultMap=/Game/World/lent
EditorStartupMap=/Game/World/lent


; ADR-029: optional NVIDIA render features, found at runtime and never a build dependency. Each
; feature needs its plugin enabled, an NVIDIA GPU, these console variables and a true support query
; (a static parameterless UFUNCTION returning bool, "/Script/Module.Class:Function"). A missing piece
; makes the feature unavailable with that reason in the MB2RENDER log line; nothing crashes.
; The names are checked against NVIDIA's UE 5.8 DLSS 4.5 package v8.9.0 (Docs/RENDERING_NVIDIA.md).
[/Script/MarburgumIIClient.MarburgumRenderFeatureSubsystem]
DlssPlugin=DLSS
DlssEnableCVar=r.NGX.DLSS.Enable
DlssSupportQuery=/Script/DLSSBlueprint.DLSSLibrary:IsDLSSSupported
FrameGenerationPlugin=StreamlineDLSSG
FrameGenerationEnableCVar=r.Streamline.DLSSG.Enable
FrameGenerationSupportQuery=/Script/StreamlineDLSSGBlueprint.StreamlineLibraryDLSSG:IsDLSSGSupported
ReflexPlugin=StreamlineReflex
ReflexEnableCVar=t.Streamline.Reflex.Enable
ReflexModeCVar=t.Streamline.Reflex.Mode
ReflexSupportQuery=/Script/StreamlineReflexBlueprint.StreamlineLibraryReflex:IsReflexSupported
; ADR-030: DLSS 5 Neural Rendering through the vendored DLSS5ForUE5 source. Its runtime is never
; committed; the feature stays unavailable (runtime_missing) until one is supplied at this path.
NeuralRenderingPlugin=DLSS5ForUE5
NeuralRenderingEnableCVar=r.DLSS5.Enable
NeuralRenderingRuntimeFile=Binaries/ThirdParty/Win64/nvngx_dlssnr.dll

[/Script/Engine.NetworkSettings]
; QA 2026-11-19, AR9: HTTPS to the account service always verifies the certificate. Unset, UE 5.8.3 verifies only
; when it finds a CA bundle (CurlHttpManager.cpp), so a host without one sent the server key and players' passwords
; to whoever answered. With this set, no bundle means no connection. Linux finds the system bundle under /etc/ssl or
; /etc/pki; an operator's own CA goes in [SSL] OverrideCertificateBundlePath, as the account smoke does.
n.VerifyPeer=True

; Game packets are AES-256-GCM encrypted with a key per connection from the account service (ADR-083). The component
; is inactive until a signed-in connection gets its key; a server that requires accounts requires it of everyone.
[PacketHandlerComponents]
EncryptionComponent=MarburgumNetCrypto

; Interface DPI (UI_HUD_DESIGN §3, QA U6/U9): the HUD is designed at 1080p. The engine default shrinks it to 67 % at
; 720p, where 14 px body text falls to 9 px; this curve keeps 720p at 80 % and grows to 133 % at 1440p and 200 % at 4K.
; The player's interface scale (Settings) multiplies on top.
[/Script/Engine.UserInterfaceSettings]
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480,Value=0.6),(Time=720,Value=0.8),(Time=1080,Value=1.0),(Time=1440,Value=1.3333),(Time=2160,Value=2.0),(Time=8640,Value=8.0))),ExternalCurve=None)
