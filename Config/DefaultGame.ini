; ADR-044: the walk graph street people follow is a JSON file beside the content, read by the server.
+DirectoriesToAlwaysStageAsUFS=(Path="Marburgum/Street")
; ADR-061: the climate the server's weather is drawn from, and the landscape's surface map, read by server and client.
+DirectoriesToAlwaysStageAsUFS=(Path="Marburgum/Weather")
+DirectoriesToAlwaysStageAsUFS=(Path="Marburgum/Ground")
; ADR-063: the place names (districts, streets and squares, landmarks), resolved by the server and named by the client.
+DirectoriesToAlwaysStageAsUFS=(Path="Marburgum/Places")

; ADR-019: the server bounds how much movement time a client's ServerMove timestamps may claim.
; A client whose clock runs ahead of the server's by more than MaxTimeMargin is detected, and its
; moves are then limited to server time until it has paid back all the time it took (ResolutionRate
; 1 = pay back as fast as possible). Over any stretch of real time T a client therefore moves for at
; most T + 0.25 s, so at most MaxWalkSpeed * 0.25 s (1.1 m at 4.5 m/s) further than an honest one.
; No drift allowance: any allowance is a permanent speed bonus for a fast clock. MinTimeMargin keeps a
; slow or hitching client from banking more than 0.25 s it could later spend at once.
[/Script/Engine.GameNetworkManager]
bMovementTimeDiscrepancyDetection=True
bMovementTimeDiscrepancyResolution=True
MovementTimeDiscrepancyMaxTimeMargin=0.25
MovementTimeDiscrepancyMinTimeMargin=-0.25
MovementTimeDiscrepancyResolutionRate=1.0
MovementTimeDiscrepancyDriftAllowance=0.0
bMovementTimeDiscrepancyForceCorrectionsDuringResolution=True

; ADR-019: the engine default (0.0005 s) stretches every frame shorter than 0.5 ms to 0.5 ms, so a
; client running above 2000 fps (a -nullrhi process, or a trivial scene with no frame cap) advances
; its world clock faster than real time and would be corrected as a speed hack. 0 keeps world time
; equal to real time however fast the frame rate. MaxUndilatedFrameTime (0.4 s) stays: it only ever
; slows the clock.
[/Script/Engine.WorldSettings]
MinUndilatedFrameTime=0
